name: Deploy Client

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-client
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          API_PROXY_URL: http://127.0.0.1:8080
        run: npm run build

      - name: Pack release
        run: |
          mkdir -p release
          cp -a .next/standalone release/standalone
          cp -a .next/static release/static
          cp -a public release/public
          tar -czf client-release.tar.gz -C release .

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync deploy scripts on server
        run: |
          tar -czf repo-sync.tar.gz ecosystem.config.cjs scripts/deploy-remote.sh
          scp -o StrictHostKeyChecking=yes repo-sync.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/client-repo-sync.tar.gz"
          ssh -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p ${CLIENT_DEPLOY_PATH}/scripts && tar -xzf /tmp/client-repo-sync.tar.gz -C ${CLIENT_DEPLOY_PATH} && rm -f /tmp/client-repo-sync.tar.gz"
        env:
          CLIENT_DEPLOY_PATH: ${{ secrets.CLIENT_DEPLOY_PATH }}

      - name: Upload release and deploy
        run: |
          scp -o StrictHostKeyChecking=yes client-release.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/client-release.tar.gz"
          ssh -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p /tmp/client-release && tar -xzf /tmp/client-release.tar.gz -C /tmp/client-release && bash ${CLIENT_DEPLOY_PATH}/scripts/deploy-remote.sh /tmp/client-release && rm -rf /tmp/client-release /tmp/client-release.tar.gz"
        env:
          CLIENT_DEPLOY_PATH: ${{ secrets.CLIENT_DEPLOY_PATH }}
