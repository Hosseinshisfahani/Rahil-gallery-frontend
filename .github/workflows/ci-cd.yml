name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-after-api]

permissions:
  contents: read

concurrency:
  group: ci-cd-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          API_PROXY_URL: http://127.0.0.1:8080
        run: npm run build

  deploy:
    name: Deploy client to production
    runs-on: ubuntu-latest
    needs: ci
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          API_PROXY_URL: http://127.0.0.1:8080
        run: npm run build

      - name: Pack release
        run: |
          mkdir -p release
          cp -a .next/standalone release/standalone
          cp -a .next/static release/static
          cp -a public release/public
          tar -czf client-release.tar.gz -C release .

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync client source on VPS
        run: |
          GITHUB_SHA=${{ github.sha }} bash scripts/package-client-source.sh client-source.tar.gz
          scp -o StrictHostKeyChecking=yes client-source.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/client-source.tar.gz"
          ssh -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -euo pipefail
             STAGING=\$(mktemp -d)
             trap 'rm -rf \"\$STAGING\"' EXIT
             tar -xzf /tmp/client-source.tar.gz -C \"\$STAGING\"
             mkdir -p \"${CLIENT_DEPLOY_PATH}\"
             rsync -a --delete \
               --exclude '.env' \
               --exclude '.next/' \
               --exclude 'node_modules/' \
               \"\$STAGING/\" \"${CLIENT_DEPLOY_PATH}/\"
             rm -f /tmp/client-source.tar.gz
             echo \"==> Client source synced to ${CLIENT_DEPLOY_PATH} (\$(cat \"${CLIENT_DEPLOY_PATH}/.deploy-sha\" 2>/dev/null || echo unknown))\""
        env:
          CLIENT_DEPLOY_PATH: ${{ secrets.CLIENT_DEPLOY_PATH }}

      - name: Upload release and deploy
        run: |
          scp -o StrictHostKeyChecking=yes client-release.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/client-release.tar.gz"
          ssh -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p /tmp/client-release && tar -xzf /tmp/client-release.tar.gz -C /tmp/client-release && bash ${CLIENT_DEPLOY_PATH}/scripts/deploy-remote.sh /tmp/client-release && rm -rf /tmp/client-release /tmp/client-release.tar.gz"
        env:
          CLIENT_DEPLOY_PATH: ${{ secrets.CLIENT_DEPLOY_PATH }}

      - name: Verify client health
        run: |
          for attempt in $(seq 1 15); do
            if ssh -o StrictHostKeyChecking=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "curl -sf http://127.0.0.1:3000/admin/login >/dev/null"; then
              echo "Client health check passed"
              exit 0
            fi
            echo "Waiting for client (attempt ${attempt}/15)..."
            sleep 4
          done
          echo "Client health check failed"
          exit 1
